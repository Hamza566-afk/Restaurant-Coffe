<div class="captcha-container">
  <label class="captcha-label">رمز الأمان (Captcha) *</label>
  <div class="captcha-box">
    <div class="captcha-display">
      <span class="captcha-text">{{ captchaCode }}</span>
    </div>

    <button type="button" (click)="generateCaptcha()" title="تحديث الرمز" class="refresh-btn">
      🔄
    </button>

    <input
      type="text"
      maxLength="5"
      [(ngModel)]="userInput"
      (input)="validate()"
      placeholder="5 رموز"
      class="captcha-input"
    />
  </div>
</div>
