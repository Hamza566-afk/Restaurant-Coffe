<div class="captcha-container">
  <label class="captcha-label">
    * {{ langService.t('auth.captchaLabel') }}
  </label>
  
  <div class="captcha-input-group">
    <div class="captcha-code-box">
      {{ captchaCode }}
    </div>
    
    <button type="button" class="refresh-btn" (click)="generateCaptcha()">
      🔄
    </button>

    <input 
      type="text" 
      [(ngModel)]="userInput"
      (input)="validate()"
      class="captcha-input"
    />
  </div>
</div>
