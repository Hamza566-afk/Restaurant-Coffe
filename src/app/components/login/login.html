<div class="login-container">
  <form class="login-form" (ngSubmit)="onLogin()">
    <h2>Login in</h2>
    <p>Welcome Back Mr Hadded</p>
    
    <div class="input-group">
      <input name="email" [(ngModel)]="email" type="email" placeholder="Gmail" required>
    </div>
    
    <div class="input-group">
      <input name="password" [(ngModel)]="password" type="password" placeholder="Password" required>
    </div>
    
    <button type="submit">Login</button>
  </form>
</div>
