<div class="auth-page" [dir]="langService.isRtl() ? 'rtl' : 'ltr'">
  <div class="auth-card">
    
    <div class="auth-main">
      <div class="lang-selector">
        <button type="button" [class.active]="langService.lang() === 'ar'" (click)="langService.setLanguage('ar')">العربية</button>
        <button type="button" [class.active]="langService.lang() === 'fr'" (click)="langService.setLanguage('fr')">Français</button>
        <button type="button" [class.active]="langService.lang() === 'en'" (click)="langService.setLanguage('en')">English</button>
      </div>

      <h2>نسيت كلمة السر؟</h2>
      <p class="subtitle">أدخل بريدك الإلكتروني لإرسال رمز التحقق (OTP)</p>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input 
            type="email" 
            [(ngModel)]="email" 
            name="email" 
            class="form-control" 
            placeholder="example@domain.com"
            required 
          />
        </div>

        <button type="submit" [disabled]="isLoading || !email" class="btn-primary">
          {{ isLoading ? 'جاري الإرسال...' : 'إرسال رمز التحقق' }}
        </button>

        <div class="auth-footer">
          <a routerLink="/login-owner">الرجوع لتسجيل الدخول</a>
        </div>
      </form>
    </div>

    <div class="auth-side">
      <div class="brand-badge">Café SaaS</div>
      <div class="side-content">
        <h3>حماية واسترجاع الحساب</h3>
        <p>سنساعدك في إعادة تعيين كلمة السر الخاصة بك بكل أمان ويسر.</p>
      </div>
      <div class="copyright">
        &copy; 2026 Hadded Holding. جميع الحقوق محفوظة.
      </div>
    </div>

  </div>
</div>
