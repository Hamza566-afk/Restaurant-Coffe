<div class="auth-page" [dir]="langService.isRtl() ? 'rtl' : 'ltr'">
  <div class="auth-card">
    
    <div class="auth-main">
      <div class="lang-selector">
        <button type="button" [class.active]="langService.lang() === 'ar'" (click)="langService.setLanguage('ar')">العربية</button>
        <button type="button" [class.active]="langService.lang() === 'fr'" (click)="langService.setLanguage('fr')">Français</button>
        <button type="button" [class.active]="langService.lang() === 'en'" (click)="langService.setLanguage('en')">English</button>
      </div>

      <h2>{{ langService.t('auth.forgotTitle') }}</h2>
      <p class="subtitle">{{ langService.t('auth.forgotSub') }}</p>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>{{ langService.t('auth.emailLabel') }}</label>
          <input 
            type="email" 
            [(ngModel)]="email" 
            name="email" 
            class="form-control" 
            [placeholder]="langService.t('auth.emailPlaceholder')"
            required 
          />
        </div>

        <button type="submit" [disabled]="isLoading || !email" class="btn-primary">
          {{ isLoading ? langService.t('auth.sendingOtp') : langService.t('auth.sendOtpBtn') }}
        </button>

        <div class="auth-footer">
          <a routerLink="/login-owner">{{ langService.t('auth.backToLogin') }}</a>
        </div>
      </form>
    </div>

    <div class="auth-side">
      <div class="brand-badge">Café SaaS</div>
      <div class="side-content">
        <h3>{{ langService.t('auth.resetSideTitle') }}</h3>
        <p>{{ langService.t('auth.resetSideDesc') }}</p>
      </div>
      <div class="copyright">
        &copy; 2026 Hadded Holding. {{ langService.t('auth.rights') }}
      </div>
    </div>

  </div>
</div>
