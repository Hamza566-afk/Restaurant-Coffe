<!-- أزرار تغيير اللغة -->
<div class="lang-selector">
  <button [class.active]="langService.lang() === 'ar'" (click)="langService.setLanguage('ar')">العربية</button>
  <button [class.active]="langService.lang() === 'fr'" (click)="langService.setLanguage('fr')">Français</button>
  <button [class.active]="langService.lang() === 'en'" (click)="langService.setLanguage('en')">English</button>
</div>

<!-- العناوين والترجمة -->
<h2>{{ langService.t('auth.otpTitle') }}</h2>
<p class="subtitle">
  {{ langService.t('auth.otpSubtitle') }}
  <br><strong>{{ email }}</strong>
</p>

<!-- الأزرار -->
<button (click)="onVerify()" [disabled]="isLoading" class="btn-primary">
  {{ isLoading ? '...' : langService.t('auth.verifyBtn') }}
</button>

<button (click)="resendOtp()" class="btn-secondary">
  {{ langService.t('auth.resendBtn') }}
</button>

<!-- القسم الغامق -->
<div class="side-content">
  <h3>{{ langService.t('auth.otpSideTitle') }}</h3>
  <p>{{ langService.t('auth.otpSideDesc') }}</p>
</div>
