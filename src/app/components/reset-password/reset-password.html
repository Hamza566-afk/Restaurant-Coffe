<div class="auth-page" [dir]="langService.isRtl() ? 'rtl' : 'ltr'">
  <div class="auth-card">
    <div class="auth-main">
      <h2>تعيين كلمة سر جديدة</h2>
      <p class="subtitle">قم بإدخال كلمة السر الجديدة الخاصة بحسابك</p>

      <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>كلمة السر الجديدة</label>
          <input type="password" [(ngModel)]="password" name="password" class="form-control" required />
        </div>

        <div class="form-group">
          <label>تأكيد كلمة السر الجديدة</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control" required />
        </div>

        <button type="submit" [disabled]="isLoading || !password || !confirmPassword" class="btn-primary">
          {{ isLoading ? 'جاري التحديث...' : 'تغيير كلمة السر' }}
        </button>
      </form>
    </div>

    <div class="auth-side">
      <div class="brand-badge">Café SaaS</div>
      <div class="side-content">
        <h3>كلمة سر جديدة</h3>
        <p>احرص على اختيار كلمة سر قوية للحفاظ على أمان حسابك ومحلك.</p>
      </div>
    </div>
  </div>
</div>
