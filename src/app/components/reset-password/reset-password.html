<div class="auth-page" [dir]="langService.isRtl() ? 'rtl' : 'ltr'">
  <div class="auth-card">
    <div class="auth-main">
      <!-- Language Switcher Buttons -->
      <div class="lang-switcher">
        <button 
          type="button" 
          [class.active]="langService.lang() === 'ar'" 
          (click)="setLanguage('ar')">
          العربية
        </button>
        <button 
          type="button" 
          [class.active]="langService.lang() === 'fr'" 
          (click)="setLanguage('fr')">
          Français
        </button>
        <button 
          type="button" 
          [class.active]="langService.lang() === 'en'" 
          (click)="setLanguage('en')">
          English
        </button>
      </div>

      <h2>{{ langService.t('auth.newPasswordLabel') }}</h2>
      <p class="subtitle">{{ langService.t('auth.resetSideDesc') }}</p>

      <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>{{ langService.t('auth.newPasswordLabel') }}</label>
          <input type="password" [(ngModel)]="password" name="password" class="form-control" required />
        </div>

        <div class="form-group">
          <label>{{ langService.t('auth.confirmNewPasswordLabel') }}</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" class="form-control" required />
        </div>

        <button type="submit" [disabled]="isLoading || !password || !confirmPassword" class="btn-primary">
          {{ isLoading ? langService.t('auth.resettingPassword') : langService.t('auth.resetPasswordBtn') }}
        </button>
      </form>
    </div>

    <div class="auth-side">
      <div class="brand-badge">Café SaaS</div>
      
      <div class="side-content">
        <h3>{{ langService.t('auth.resetSideTitle') }}</h3>
        <p>{{ langService.t('auth.resetSideDesc') }}</p>
      </div>

      <div class="side-footer">
        <p>© 2026 Hadded Holding. {{ langService.t('auth.rights') }}</p>
      </div>
    </div>
  </div>
</div>
