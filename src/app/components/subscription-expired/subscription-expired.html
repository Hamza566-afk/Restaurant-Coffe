<div class="expired-container" style="text-align: center; padding: 50px; direction: rtl;">
  <div class="card" style="max-width: 500px; margin: auto; padding: 30px; border: 1px solid #ffccd5; background-color: #fff5f5; border-radius: 12px;">
    <i class="fas fa-exclamation-circle" style="font-size: 48px; color: #e53e3e; margin-bottom: 20px;"></i>
    <h2 style="color: #c53030; margin-bottom: 15px;">انتهت فترة الاشتراك!</h2>
    <p style="color: #4a5568; font-size: 16px; line-height: 1.6;">
      عذراً، لقد انتهت صلاحية الاشتراك الخاصة بمتجرك. للاستمرار في استخدام لوحة التحكم وإدارة طلبات عملائك، يرجى تجديد الاشتراك أو التواصل مع الإدارة.
    </p>
    
    <div style="margin-top: 30px; display: flex; justify-content: center; gap: 15px;">
      <button class="btn btn-primary" style="background-color: #3182ce; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;">
        تجديد الاشتراك الآن
      </button>
      <button (click)="logout()" class="btn btn-danger" style="background-color: #e53e3e; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;">
        تسجيل الخروج
      </button>
    </div>
  </div>
</div>
